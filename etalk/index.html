<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Pulso do Time</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><main class="wrap"><p class="hint">Carregando…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="shared.js"></script><script>
let cfg={phase:'survey',options:[]},preview=false,step=-1,picks=[],ans=Array(Q.length).fill('');try{const d=JSON.parse(ls.get('pulso_draft')||'null');if(Array.isArray(d)&&d.length===Q.length)ans=d}catch(e){}
const msg=(t,i='💙',x='')=>`${banner()}<main class="wrap center"><p class="big">${i}</p><h1>${t}</h1>${x}</main>`;
const banner=()=>preview?`<div class="prev"><span>👁 Pré-visualização do participante — nada é salvo</span><button id="bkp">Voltar ao painel</button></div>`:'';
const bindBanner=()=>{const b=document.getElementById('bkp');if(b)b.onclick=()=>{preview=false;step=-1;picks=[];route()}};
function route(){rendered=true;
 if(admin&&!preview)return adminView();
 if(cfg.phase==='survey')survey();else if(cfg.phase==='voting')voteView();
 else app.innerHTML=msg('A coleta foi encerrada. Obrigado por participar!','🙏');
 bindBanner();}

function survey(){
 if(!preview&&ls.get('pulso_done'))return app.innerHTML=msg('Resposta enviada. Muito obrigado por contribuir!','✅','<p class="hint">Sua opinião é anônima e vai ajudar a construir o plano de ação do time.</p>');
 if(step<0)return app.innerHTML=`${banner()}<main class="wrap center" style="padding-top:60px"><p class="big">🫶</p><h1>Pulso do Time</h1>
 <p>Queremos ouvir você para melhorar o clima e a rotina do nosso time.</p>
 <p class="hint">⏱ Cerca de 5 minutos · ${Q.length} perguntas abertas · 🔒 100% anônimo</p>
 <div class="row" style="justify-content:center"><button id="st">Começar</button></div></main>`,document.getElementById('st').onclick=()=>{step=0;survey()},bindBanner();
 const q=Q[step],last=step===Q.length-1;
 app.innerHTML=`${banner()}<main class="wrap"><div class="bar"><i style="width:${(step+1)/Q.length*100}%"></i></div>
 <span class="tag">${q.e}</span><p class="hint" style="margin:.5rem 0 0">Pergunta ${step+1} de ${Q.length}</p><h1>${esc(q.t)}</h1>
 <textarea id="ta" placeholder="Escreva com sinceridade. Exemplos concretos ajudam muito…">${esc(ans[step])}</textarea>
 <p class="kb">🔒 Anônimo · rascunho salvo automaticamente · Ctrl+Enter para avançar</p><p id="e" class="err"></p>
 <div class="row"><button class="ghost" id="bk">← Voltar</button><button id="nx">${last?'Enviar respostas ✓':'Próxima →'}</button></div></main>`;
 const ta=document.getElementById('ta'),nx=document.getElementById('nx');
 const chk=()=>{ans[step]=ta.value;nx.disabled=ta.value.trim().length<3;ls.set('pulso_draft',JSON.stringify(ans))};chk();ta.oninput=chk;ta.focus();
 document.getElementById('bk').onclick=()=>{step--;survey()};
 ta.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!nx.disabled)nx.click()};
 nx.onclick=async()=>{
  if(!last){step++;return survey()}
  nx.disabled=true;nx.textContent='Enviando…';
  try{if(!preview){const{error}=await sb.from('responses').insert({answers:ans.map(x=>x.trim())});if(error)throw error;ls.set('pulso_done','1')}
   if(preview){app.innerHTML=msg('Resposta enviada (simulação)','✅');bindBanner()}else survey()}
  catch(e){document.getElementById('e').textContent='Não foi possível enviar. Tente novamente.';nx.disabled=false;nx.textContent='Enviar respostas ✓'}};
 bindBanner();}

function voteView(){
 if(!preview&&ls.get('pulso_voted'))return app.innerHTML=msg('Voto registrado. Obrigado!','🗳️');
 app.innerHTML=`${banner()}<main class="wrap"><span class="tag">Votação</span><h1 style="margin-top:.8rem">${VQ}</h1><p class="hint">Toque para selecionar exatamente 2 opções. Seu voto é anônimo.</p>
 ${cfg.options.map(o=>`<button class="opt ${picks.includes(o.id)?'sel':''}" data-id="${o.id}"><span class="ck">✓</span><span><small>${esc(o.pilar)}</small>${esc(o.acao)}</span></button>`).join('')}
 <p id="e" class="err"></p><div class="row"><button id="go" ${picks.length===2?'':'disabled'}>Enviar voto (${picks.length}/2)</button></div></main>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const id=b.dataset.id;
  picks=picks.includes(id)?picks.filter(x=>x!==id):picks.length<2?[...picks,id]:picks;voteView()});
 document.getElementById('go').onclick=async()=>{
  try{if(preview){app.innerHTML=msg('Voto enviado (simulação)','🗳️');return bindBanner()}
   const{error}=await sb.from('votes').insert({picks});if(error)throw error;ls.set('pulso_voted','1');voteView()}
  catch(e){document.getElementById('e').textContent='Não foi possível registrar. Tente novamente.'}};
 bindBanner();}


function route(){if(cfg.phase==='survey')survey();else if(cfg.phase==='voting')voteView();else app.innerHTML=msg('A coleta foi encerrada. Obrigado por participar!','🙏')}
(async()=>{
 try{const{data,error}=await sb.from('config').select('phase,options').eq('id',1).single();if(error)throw error;cfg={phase:data.phase,options:data.options||[]}}
 catch(e){app.innerHTML=msg('Não foi possível carregar. Tente novamente em instantes.','⚠️');return}
 route()})();
</script></body></html>
